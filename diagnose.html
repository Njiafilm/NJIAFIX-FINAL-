<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>NjiaFix - Uchunguzi wa Kiotomatiki</title>
<style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
    h1 { color: #38bdf8; }
    .device-card { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .issue { background: #334155; border-radius: 8px; padding: 14px; margin: 10px 0; }
    .issue-header { display: flex; justify-content: space-between; align-items: center; }
    .fix-btn { background: #22c55e; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .fix-btn:hover { background: #16a34a; }
    .fix-btn:disabled { background: #64748b; cursor: not-allowed; }
    .no-action { color: #94a3b8; font-size: 13px; font-style: italic; }
    .severity-high { border-left: 4px solid #ef4444; }
    .severity-medium { border-left: 4px solid #f59e0b; }
    .severity-low { border-left: 4px solid #38bdf8; }
    .status-msg { font-size: 14px; margin-top: 6px; color: #94a3b8; }
    .guide-box { background: #0f172a; border-radius: 6px; padding: 10px; margin-top: 10px; white-space: pre-line; line-height: 1.5; font-size: 14px; }
    .guide-title { color: #ffd60a; font-weight: bold; margin-bottom: 4px; }
    #refreshBtn { background: #38bdf8; border: none; color: #0f172a; font-weight: bold; padding: 10px 18px; border-radius: 6px; cursor: pointer; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>🔧 NjiaFix - Uchunguzi wa Kiotomatiki (Ofline)</h1>
<button id="refreshBtn" onclick="loadDevices()">🔄 Tafuta Vifaa Vilivyounganishwa</button>

<div id="devicesContainer">Bonyeza "Tafuta Vifaa" ili kuanza...</div>

<script>
async function loadDevices() {
    const container = document.getElementById("devicesContainer");
    container.innerHTML = "Inatafuta vifaa...";

    try {
        const res = await fetch("/api/devices");
        const data = await res.json();

        if (data.status !== "success" || data.devices.length === 0) {
            container.innerHTML = "<p>Hakuna kifaa kilichounganishwa. Hakikisha USB debugging imewashwa.</p>";
            return;
        }

        container.innerHTML = "";
        for (const serial of data.devices) {
            const card = document.createElement("div");
            card.className = "device-card";
            card.innerHTML = `<h3>📱 Kifaa: ${serial}</h3><p>Inachunguza kiotomatiki...</p>`;
            container.appendChild(card);
            diagnoseDevice(serial, card);
        }
    } catch (err) {
        container.innerHTML = `<p>Hitilafu: ${err.message}</p>`;
    }
}

async function diagnoseDevice(serial, card) {
    try {
        const res = await fetch(`/api/diagnose/${serial}`);
        const data = await res.json();

        if (data.status !== "success") {
            card.innerHTML += `<p>Imeshindwa kuchunguza: ${data.message}</p>`;
            return;
        }

        if (data.issues.length === 0) {
            card.innerHTML = `<h3>📱 Kifaa: ${serial}</h3><p>✅ Hakuna tatizo lililogundulika kiotomatiki.</p>`;
            return;
        }

        let html = `<h3>📱 Kifaa: ${serial}</h3><p>Matatizo ${data.issue_count} yamegundulika kiotomatiki:</p>`;

        for (const issue of data.issues) {
            const guide = issue.guide;
            const guideHtml = guide ? `
                <div class="guide-box">
                    <div class="guide-title">📋 ${guide.title} (Ugumu: ${guide.difficulty})</div>
                    ${guide.solution_steps}
                </div>` : `<div class="guide-box">Hakuna guide iliyounganishwa na tatizo hili bado.</div>`;

            const actionBtn = issue.action
                ? `<button class="fix-btn" onclick="fixIssue('${serial}', '${issue.category}', '${issue.action}', '${issue.code}', this)">Rekebisha</button>`
                : `<span class="no-action">Hatua ya mkono - fuata guide</span>`;

            html += `
                <div class="issue severity-${issue.severity}">
                    <div class="issue-header">
                        <div>
                            <strong>${issue.code}</strong><br>
                            <span>${issue.description}</span>
                        </div>
                        ${actionBtn}
                    </div>
                    <div class="status-msg" id="status-${serial}-${issue.code}"></div>
                    ${guideHtml}
                </div>`;
        }
        card.innerHTML = html;
    } catch (err) {
        card.innerHTML += `<p>Hitilafu ya uchunguzi: ${err.message}</p>`;
    }
}

async function fixIssue(serial, category, action, issueCode, buttonEl) {
    buttonEl.disabled = true;
    buttonEl.textContent = "Inarekebisha...";
    const statusEl = document.getElementById(`status-${serial}-${issueCode}`);

    try {
        const res = await fetch("/execute-fix", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ category, action })
        });
        const data = await res.json();

        if (data.status === "success") {
            buttonEl.textContent = "✅ Imekamilika";
            statusEl.textContent = "Tatizo limeondolewa kwa mafanikio.";
        } else {
            buttonEl.textContent = "❌ Imeshindikana";
            buttonEl.disabled = false;
            statusEl.textContent = data.message || "Hitilafu isiyojulikana.";
        }
    } catch (err) {
        buttonEl.textContent = "❌ Hitilafu";
        buttonEl.disabled = false;
        statusEl.textContent = err.message;
    }
}
</script>

</body>
</html>
