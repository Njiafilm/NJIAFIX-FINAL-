# Sawa na app.run(host='127.0.0.1', port=5555) kwenye Flask
server.address=127.0.0.1
server.port=5555

spring.application.name=njiafix-java

# Sawa na LANGUAGE_CODE / TIME_ZONE kwenye Django settings.py
spring.mvc.locale=sw
spring.jackson.time-zone=Africa/Dar_es_Salaam
user.timezone=Africa/Dar_es_Salaam

# Faili za static (HTML/CSS/JS/manifest/sw.js) - sawa na STATIC_URL
spring.web.resources.static-locations=classpath:/static/

# Database (H2, faili moja ndani ya kompyuta - inafanya kazi OFLINE, hakuna server inayohitajika)
spring.datasource.url=jdbc:h2:file:./njiafix-data;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop=kwa majaribio ya kwanza (inafuta data kila restart)
# update=inatunza data uliyoingiza baada ya jaribio la kwanza - BADILISHA hii kuwa 'update' baada ya kupima
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
