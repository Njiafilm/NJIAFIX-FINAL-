<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matengenezo - NJIAFIX</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f2a3a">

<style>
  body { font-family: Arial, sans-serif; background: #0f2a3a; color: #fff; margin: 0; padding: 16px; box-sizing: border-box; }
  h2 { text-align: center; color: #ffd60a; margin-bottom: 16px; }
  #search { width: 100%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 16px; font-size: 16px; box-sizing: border-box; }
  .cats { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .cat-btn { background: #ffd60a; color: #0f2a3a; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; border: none; }
  .cat-btn.active { background: #0e6e8c; color: #fff; }
  .guide { background: #163c52; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
  .guide h3 { margin: 0 0 6px 0; color: #ffd60a; }
  .guide .meta { font-size: 12px; opacity: 0.8; margin-bottom: 8px; }
  .guide .steps { white-space: pre-line; line-height: 1.5; margin-bottom: 12px; }
  .tool-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px; }
  .action-btn { background: #ffd60a; color: #0f2a3a; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .bt-btn { background: #0e6e8c; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .otg-btn { background: #e07a5f; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .wifi-btn { background: #2a9d8f; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .car-btn { background: #e76f51; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .print-btn { background: #457b9d; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .loading { text-align: center; padding: 20px; opacity: 0.7; }
  .offline-banner { background: #e07a5f; color: #fff; padding: 8px; text-align: center; font-size: 13px; margin-bottom: 12px; border-radius: 6px; font-weight: bold; }
</style>
</head>
<body>

<h2>🔧 NjiaFix - Jopo la Ufundi (All-in-One Dashboard)</h2>
<input type="text" id="search" placeholder="Tafuta tatizo... mfano: Simu, Printer, Gari, Camera">

<div class="cats" id="cats">
  <button class="cat-btn active" data-id="">Zote</button>
</div>

<div id="results"><div class="loading">Inapakia...</div></div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then((reg) => console.log('Service Worker imesajiliwa!', reg.scope))
      .catch((err) => console.log('Imeshindikana kusajili Service Worker:', err));
  });
}

async function connectViaBluetooth() {
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['battery_service', '000018f0-0000-1000-8000-00805f9b34fb']
    });
    const server = await device.gatt.connect();
    try {
      const service = await server.getPrimaryService('000018f0-0000-1000-8000-00805f9b34fb');
      const characteristic = await service.getCharacteristic('00002af1-0000-1000-8000-00805f9b34fb');
      const encoder = new TextEncoder();
      await characteristic.writeValue(encoder.encode("NjiaFix Test Print\n------------------\nKifaa kimeunganishwa!\n"));
      alert("Imefanikiwa kuunganishwa na kutuma amri kwenye Printa ya Bluetooth!");
    } catch (printErr) {
      alert("Imefanikiwa kuunganishwa na kifaa cha Bluetooth: " + (device.name || "Bluetooth Device"));
    }
  } catch (error) {
    alert("Imeshindikana kuunganishwa kwa Bluetooth: " + error);
  }
}

function connectViaOTG() {
  alert("Unganisha kifaa chako kupitia OTG cable. Hakikisha 'USB Debugging' au OTG imewashwa kwenye kifaa kinachotengenezwa.");
}

async function connectViaWiFi() {
  let ipAddress = prompt("Weka IP address ya kifaa au Camera/Printer (mfano: 192.168.1.50):");
  if (!ipAddress) return;
  try {
    await fetch(`http://${ipAddress}/api/status`, { method: 'GET', mode: 'no-cors' });
    alert("Kifaa kimeitikia vizuri kupitia IP: " + ipAddress);
  } catch (error) {
    alert("Imeshindikana kuunganishwa na kifaa. Hakikisha IP ni sahihi na mpo mtandao mmoja.");
  }
}

async function rebootNetworkCamera(ipAddress) {
  try {
    await fetch(`http://${ipAddress}/cgi-bin/hopper?action=reboot`, { method: 'GET', mode: 'no-cors' });
    alert("Amri ya kuanzisha upya imetumwa kwa Camera kupitia IP: " + ipAddress);
  } catch (err) {
    alert("Imeshindikana kuwasiliana na kifaa moja kwa moja.");
  }
}

async function runDeviceAction(deviceType, action) {
  if (deviceType === 'printer' || deviceType === 'photocopy') {
    if (action === 'spooler') alert("Inasafisha na kuwasha upya Print Spooler...");
    else if (action === 'test') alert("Inatuma amri ya 'Test Print' kwenye Printa...");
    return;
  }
  if (deviceType === 'camera') {
    if (action === 'ping') alert("Inakagua muunganisho (Ping IP) wa Camera/NVR...");
    else if (action === 'reboot') {
      let ip = prompt("Weka IP address ya Camera unayotaka kui-reboot:");
      if (ip) rebootNetworkCamera(ip);
    }
    return;
  }
  if (deviceType === 'car' || deviceType === 'gari') {
    if (action === 'scan') alert("Inasoma namba za hitilafu za Injini (OBD2 DTC Codes)...");
    else if (action === 'clear') alert("Inafuta kumbukumbu za hitilafu (Clear ECU Codes)...");
    return;
  }

  try {
    let response = await fetch('/execute-fix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ category: deviceType, action: action })
    });
    let data = await response.json();
    alert("Matokeo: " + (data.message || data.output));
  } catch (err) {
    alert("Hitilafu: " + err.message);
  }
}

function getDeviceButtons(categoryName) {
  let cat = (categoryName || "").toLowerCase();
  let buttons = `
    <button class="bt-btn" onclick="connectViaBluetooth()">Bluetooth Link</button>
    <button class="otg-btn" onclick="connectViaOTG()">OTG Link</button>
    <button class="wifi-btn" onclick="connectViaWiFi()">Wi-Fi Link</button>
  `;

  if (cat.includes('printer') || cat.includes('photocopy') || cat.includes('ofisi')) {
    buttons += `
      <button class="print-btn" onclick="runDeviceAction('printer', 'spooler')">Fix Spooler</button>
      <button class="print-btn" onclick="runDeviceAction('printer', 'test')">Test Print</button>`;
  } else if (cat.includes('kamera') || cat.includes('camera')) {
    buttons += `
      <button class="wifi-btn" onclick="runDeviceAction('camera', 'ping')">Ping Camera IP</button>
      <button class="print-btn" onclick="runDeviceAction('camera', 'reboot')">Reboot Camera</button>`;
  } else if (cat.includes('gari') || cat.includes('car')) {
    buttons += `
      <button class="car-btn" onclick="runDeviceAction('car', 'scan')">Scan OBD2</button>
      <button class="car-btn" onclick="runDeviceAction('car', 'clear')">Clear ECU</button>`;
  } else {
    buttons += `
      <button class="action-btn" onclick="runDeviceAction('simu', 'reboot')">Reboot Kifaa</button>
      <button class="action-btn" onclick="runDeviceAction('kompyuta', 'flush_dns')">Flush DNS (PC)</button>`;
  }
  return buttons;
}

let activeCategory = "";
let allCategories = [];

async function loadCategories() {
  try {
    const res = await fetch('/api/categories');
    const data = await res.json();
    allCategories = data.categories || [];

    const catsDiv = document.getElementById('cats');
    allCategories.forEach(catName => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.dataset.id = catName;
      btn.textContent = catName;
      btn.addEventListener('click', () => selectCategory(btn));
      catsDiv.appendChild(btn);
    });
  } catch (err) {
    console.log('Imeshindikana kupakia kategoria:', err);
  }
}

function selectCategory(btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.id;
  loadGuides(document.getElementById('search').value);
}

function displayGuides(guidesObj, isOffline = false) {
  const results = document.getElementById('results');
  results.innerHTML = isOffline ? '<div class="offline-banner">Upo Offline - Unatumia kumbukumbu zilizohifadhiwa kwenye simu</div>' : '';

  const guides = Object.values(guidesObj || {});
  if (guides.length === 0) {
    results.innerHTML += '<div class="loading">Hakuna matokeo yaliyopatikana.</div>';
    return;
  }

  guides.forEach(g => {
    const div = document.createElement('div');
    div.className = 'guide';
    const stepsText = Array.isArray(g.steps) ? g.steps.join('\n') : (g.solution_steps || '');
    div.innerHTML = `
      <h3>${g.title}</h3>
      <div class="meta">${g.category ? 'Kundi: ' + g.category : ''}</div>
      <div class="steps">${stepsText}</div>
      <div class="tool-btns">${getDeviceButtons(g.category)}</div>
    `;
    results.appendChild(div);
  });
}

function loadGuides(query = '') {
  const results = document.getElementById('results');
  results.innerHTML = '<div class="loading">Inapakia...</div>';

  const url = query ? `/api/search?q=${encodeURIComponent(query)}` : `/api/search?q=${encodeURIComponent(activeCategory)}`;

  fetch(url)
    .then(r => r.json())
    .then(data => {
      if (data.results) {
        localStorage.setItem('cached_guides_' + activeCategory, JSON.stringify(data.results));
        displayGuides(data.results, false);
      }
    })
    .catch(() => {
      let savedData = localStorage.getItem('cached_guides_' + activeCategory);
      if (savedData) {
        displayGuides(JSON.parse(savedData), true);
      } else {
        results.innerHTML = '<div class="loading">Hakuna mtandao na hakuna kumbukumbu za akiba zilizohifadhiwa.</div>';
      }
    });
}

document.getElementById('search').addEventListener('input', (e) => loadGuides(e.target.value));
document.querySelector('.cat-btn[data-id=""]').addEventListener('click', function () { selectCategory(this); });

loadCategories();
loadGuides();
</script>
</body>
</html>
