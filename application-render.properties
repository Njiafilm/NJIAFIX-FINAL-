# Inatumika tu Render inapoendesha app (SPRING_PROFILES_ACTIVE=render)
# Inabatilisha (override) application.properties ya msingi iliyokusudiwa matumizi ya OFLINE/lokali

# Render inatoa PORT yake yenyewe - lazima tuisikilize hiyo, si 5555 iliyowekwa ngumu
server.address=0.0.0.0
server.port=${PORT:8080}

# Database: H2 ya kumbukumbu (in-memory) - guides zinapakiwa upya kutoka data.sql kila deployment
# NOTE: Hii si sahihi kwa data ya kudumu (guides mpya zilizoongezwa na fundi zitapotea Render
# ikianzisha upya). Kwa uzalishaji halisi, unganisha PostgreSQL ya Render badala yake
# (ongeza dependency ya postgresql kwenye pom.xml na weka DATABASE_URL hapa).
spring.datasource.url=jdbc:h2:mem:njiafix;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.mvc.locale=sw
spring.jackson.time-zone=Africa/Dar_es_Salaam
